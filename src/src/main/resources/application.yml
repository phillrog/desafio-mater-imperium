spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mater_imperium
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
      location: ${java.io.tmpdir}
      file-size-threshold: 50KB

server:
  port: 8080
  tomcat:
    connection-timeout: 300000 # 5 minutos
    max-swallow-size: 1GB

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
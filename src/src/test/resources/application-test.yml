spring:
  datasource:
    url: jdbc:tc:postgresql:15:///mater_imperium_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: admin
    password: password

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  batch:
    database-item-reader-count-threshold: 10
    jdbc:
      isolation-level-for-create: serializable
      initialize-schema: always
    job:
      enabled: false

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
      location: ${java.io.tmpdir}
      file-size-threshold: 50KB

server:
  port: 8080
  tomcat:
    connection-timeout: 300000 # 5 minutos
    max-swallow-size: 1GB

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    # url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/mater_imperium}}
    # username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:admin}}
    # password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:password}}
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20 # conforme o poder do processador (CPU cores * 2)
      minimum-idle: 10

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:create-drop} # auto cria e remove
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
      location: ${java.io.tmpdir}
      file-size-threshold: 50KB

server:
  port: 8080
  tomcat:
    connection-timeout: 300000 # 5 minutos
    max-swallow-size: 1GB

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG
name: CI/CD Desafio Backend Mater Imperium

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  # 1. ESTÁGIO DE TESTES
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Tests
        run: mvn test

  # 2. ESTÁGIO DE COMPILAÇÃO (BUILD)
  build:
    runs-on: ubuntu-latest
    needs: test # Só faz o build se os testes passarem
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Package
        run: mvn -B package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # 3. ESTÁGIO DE IMPLANTAÇÃO (DEPLOY)
  deploy:
    runs-on: ubuntu-latest
    needs: build # Só faz o deploy se o build for gerado
    environment: production # Ativa a aprovação manual se configurado no GitHub
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway up -e production -s ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
